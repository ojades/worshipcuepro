name: Build Windows Release

on:
  push:
    branches:
      - master
    tags:
      - "v*" # Triggers on version tags
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: yarn install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BIBLE_KEY: ${{ secrets.BIBLE_API_KEY }}
          YOUVERSION_API_KEY: ${{ secrets.YOUVERSION_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

        with:
          tagName: app-v__VERSION__
          releaseName: "WorshipCuePro v__VERSION__"
          releaseBody: "Latest release."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Extract App Version
        run: |
          $config = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          echo "VERSION=$($config.version)" >> $env:GITHUB_ENV

      - name: Download Assets from Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist-assets
          gh release download app-v${{ env.VERSION }} --dir dist-assets

      - name: Rewrite latest.json URLs for R2
        run: |
          $jsonPath = "dist-assets/latest.json"
          $content = Get-Content $jsonPath -Raw
          $content = $content -replace 'https://github.com/ojades/worshipcuepro/releases/download/app-v[^/]+', 'https://pub-476fcfea486849dbb44781f977ba0e65.r2.dev'
          Set-Content -Path $jsonPath -Value $content

      - name: Sync Updates to Public Bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync dist-assets s3://worshipcuepro-updates/ --endpoint-url ${{ secrets.BUCKET_ENDPOINT }}
