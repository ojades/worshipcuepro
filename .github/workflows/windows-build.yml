name: Build Windows Release

on:
  push:
    branches:
      - master
    tags:
      - "v*" # Triggers on version tags
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: yarn install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BIBLE_KEY: ${{ secrets.BIBLE_API_KEY }}
          YOUVERSION_API_KEY: ${{ secrets.YOUVERSION_API_KEY }}
        with:
          # The action automatically replaces __VERSION__ with the version from your tauri.conf.json
          tagName: app-v__VERSION__
          releaseName: "WorshipCuePro v__VERSION__ Win"
          releaseBody: "Automated Windows release."
          releaseDraft: true
          prerelease: false
