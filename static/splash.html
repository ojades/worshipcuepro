<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Starting WorshipCuePro...</title>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                height: 100%;
                background-color: transparent;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
            }
            .splash-container {
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #09090b;
                border: 1px solid rgba(147, 51, 234, 0.3);
                border-radius: 16px;
                box-shadow: 0 0 40px rgba(147, 51, 234, 0.2);
                color: white;
            }
            .logo {
                width: 80px;
                height: 80px;
                margin-bottom: 20px;
                object-fit: contain;
                animation: pulse 2s infinite ease-in-out;
            }
            .loading-text {
                color: #a1a1aa;
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 1px;
            }
            @keyframes pulse {
                0% {
                    transform: scale(0.95);
                    opacity: 0.8;
                }
                50% {
                    transform: scale(1.05);
                    opacity: 1;
                }
                100% {
                    transform: scale(0.95);
                    opacity: 0.8;
                }
            }
        </style>
    </head>
    <body>
        <div class="splash-container">
            <img src="/worshipcuepro-logo-sq.png" alt="WCP Logo" class="logo" />
            <div id="status-text" class="loading-text">
                INITIALIZING ENGINE...
            </div>
        </div>

        <script>
            // Check if global Tauri is available to listen to events
            document.addEventListener("DOMContentLoaded", () => {
                if (window.__TAURI__ && window.__TAURI__.event) {
                    const { listen } = window.__TAURI__.event;

                    listen("app-startup-status", (event) => {
                        const statusElement =
                            document.getElementById("status-text");
                        if (statusElement && event.payload) {
                            statusElement.textContent = event.payload;
                        }
                    }).catch(console.error);
                }
            });
        </script>
    </body>
</html>
